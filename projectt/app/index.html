<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 30px;
            background-color: #f0f4f8;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #34495e;
            font-size: 1.5em;
            margin-bottom: 15px;
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out;
        }
        .section:hover {
            transform: translateY(-3px);
        }
        button {
            padding: 8px 15px;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: #fff;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:active {
            background-color: #1f6391;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 500;
            color: #555;
        }
        input[type="text"],
        input[type="file"] {
            width: 100%;
            max-width: 400px;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
        }
        input[type="file"] {
            padding: 3px;
        }
        p {
            word-wrap: break-word;
            max-width: 600px;
            margin-top: 10px;
            font-size: 1em;
        }
        .success {
            color: #27ae60;
            font-weight: 500;
        }
        .error {
            color: #c0392b;
            font-weight: 500;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 1000px;
            margin-top: 15px;
            background-color: #fff;
            border-radius: 5px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: left;
            font-size: 0.95em;
        }
        th {
            background-color: #3498db;
            color: #fff;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        /* Loading spinner styles */
        .spinner {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 10px 0;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Metadata styles */
        .metadata {
            margin-top: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 5px;
            border: 1px solid #e0e0e0;
        }
        .metadata p {
            margin: 5px 0;
            font-size: 0.95em;
        }
        .metadata strong {
            color: #34495e;
        }
        /* Table column widths */
        th:nth-child(1), td:nth-child(1) { /* Hash column */
            width: 30%;
            word-break: break-all;
        }
        th:nth-child(2), td:nth-child(2) { /* Student Name column */
            width: 20%;
        }
        th:nth-child(3), td:nth-child(3) { /* Degree Type column */
            width: 15%;
        }
        th:nth-child(4), td:nth-child(4) { /* Issuer column */
            width: 25%;
            word-break: break-all;
        }
        th:nth-child(5), td:nth-child(5) { /* Timestamp column */
            width: 20%;
        }
    </style>
</head>
<body>
    <h1>📜 Certificate Verification</h1>

    <div class="section">
        <h2>Issue Certificate (University)</h2>
        <button onclick="connectMetaMask()">Connect to MetaMask</button>
        <label>Student Name: <input type="text" id="studentName" placeholder="e.g., John Doe"></label>
        <label>Degree Type: <input type="text" id="degreeType" placeholder="e.g., BSc"></label>
        <label>Certificate PDF: <input type="file" id="issueFile" accept=".pdf"></label>
        <button onclick="issueCertificate()">Upload</button>
        <button onclick="clearIssueSection()">Clear</button>
        <div id="issueSpinner" class="spinner"></div>
        <p id="issueResult"></p>
    </div>

    <div class="section">
        <h2>Verify Certificate (Employer)</h2>
        <input type="file" id="verifyFile" accept=".pdf">
        <button onclick="verifyCertificate()">Verify</button>
        <button onclick="clearVerifySection()">Clear</button>
        <div id="verifySpinner" class="spinner"></div>
        <p id="verifyResult"></p>
    </div>

    <div class="section">
        <h2>Certificate History</h2>
        <button onclick="loadCertificateHistory()">Load History</button>
        <div id="historySpinner" class="spinner"></div>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Hash</th>
                    <th>Student Name</th>
                    <th>Degree Type</th>
                    <th>Issuer</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.7.0/dist/web3.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
